# Stock COCO classes (historical; the shipped server uses the fast_grocery backend).
# class_id -> spoken name.
#
# What this file is for
#   COCO is a well-known public image dataset of 80 everyday objects (people, cups, chairs,
#   laptops ...). It was used during early pipeline bring-up with a stock YOLO model. The
#   shipped server no longer has an ultralytics backend, so this file is kept only as a
#   historical/debug reference.
#
# Format
#   internal_id: spoken name. The ids here must match the COCO class names exactly (some
#   contain spaces). The spoken names on the right are free to change; a few are shortened
#   so they sound natural ("sports ball" -> "ball", "cell phone" -> "phone").
classes:
  person: person
  bicycle: bicycle
  car: car
  motorcycle: motorcycle
  airplane: airplane
  bus: bus
  train: train
  truck: truck
  boat: boat
  traffic light: traffic light
