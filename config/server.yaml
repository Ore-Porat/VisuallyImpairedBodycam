# Laptop server configuration (PRD section 4, 8). Paths are relative to the repo root.
#
# What this file is for
#   The laptop does the heavy lifting: it receives camera frames from the device, runs the
#   object detector, decides what to say, turns sentences into speech, and serves the
#   shopping list editor. This file holds every tunable number for that side.
#
# Who reads it
#   `slr server` and `slr sim` (slr/server/main.py) at startup, via slr/common/config.py,
#   which checks every key and rejects typos. "PRD section 4" etc. refer to the product
#   spec, PRD.pdf; FR-xx / TR-xx are its requirement numbers.
#
# How to edit safely
#   Keep the indentation (two spaces per level). Times are in seconds unless the name ends
#   in _ms (milliseconds). Positions and sizes under `guidance` are fractions of the camera
#   frame (0.0 = left/top edge, 1.0 = right/bottom edge), so they work at any resolution.
#   Restart the server after editing.

# Network ports the server listens on. 0.0.0.0 means "all network interfaces".
network:
  host: 0.0.0.0
  ws_port: 8765          # control channel: WebSocket over TCP (PRD 7.2)
  udp_port: 8766         # frame channel: UDP (PRD 7.1)
  http_port: 8767        # clip downloads + accessible shopping list editor (FR-4, FR-53)
  mdns: true             # advertise _slrslr._tcp so the device can find us (FR-51 P1)

# The object detector: fast zero-shot grocery pipeline (YOLO-World + CLIP + EgoHands).
# The TensorRT engines are not committed because they are specific to the GPU and TensorRT
# version; see models/tensorrt/README.md to copy or rebuild them.
model:
  backend: fast_grocery   # fast_grocery | scripted
  # The item catalog: ids, spoken names and the CLIP prompts used to find each item.
  # Add your own items on the shopping-list web page; they go to data/catalog_user.yaml.
  catalog_file: config/catalog.yaml
  device: auto           # auto picks CUDA, then Apple MPS, then CPU (engines need CUDA)

  # YOLO-World product detector. shelf_world_s.engine is faster; shelf_world.engine has
  # higher recall if a few FPS matter less.
  fast_detector_engine: models/tensorrt/shelf_world_s.engine
  fast_detector_imgsz: 640
  fast_detector_conf: 0.01   # low for webcam recall; use 0.1-0.25 on dense shelves
  fast_detector_iou: 0.5
  fast_max_det: 100

  # CLIP checks each crop against the items on the shopping list (no fixed label list).
  # Scores are cosine similarities, not probabilities. Calibrated on the GrocerEye val split:
  # reports/clip_item_calibration.md. 0.30 is the balanced 1-item threshold for ViT-B/16;
  # with 2+ items on the list, fast_item_margin decides close calls.
  fast_clip_model: openai/clip-vit-base-patch16
  fast_item_min_score: 0.30
  fast_item_margin: 0.02
  fast_prompt_from_box: true   # also try "a can of X" using YOLO's own box label
  fast_clip_half: true
  fast_clip_batch: 16

  # EgoHands hand detector. Set fast_hand_engine: null to disable hands.
  fast_hand_engine: models/tensorrt/hand_egohands_960.engine
  fast_hand_imgsz: 960
  fast_hand_conf: 0.55
  fast_max_hands: 2

  # Product boxes smaller than this many pixels are skipped; class-aware NMS removes
  # duplicate boxes of the same class.
  fast_min_box: 24
  fast_nms_iou: 0.30

  scripted_file: null    # scripted backend only (tests / replay without a model)

# The guidance engine: how detections become spoken directions (slr/server/guidance.py).
guidance:
  # Confidence thresholds. For the fast backend, product confidence is a CLIP cosine
  # similarity (roughly 0.20-0.40), not a probability; hand confidence is still an EgoHands
  # probability (hand_conf, below). Calibrated on the GrocerEye val split, see
  # reports/clip_item_calibration.md. conf_find matches the detector's min_score so it does
  # not throw away boxes the detector already accepted.
  conf_find: 0.30
  conf_identify: 0.33   # Identify is slightly stricter: naming the wrong thing is worse
  conf_wrong_item: 0.33

  # Stable detection (PRD 8.2): target in >= stable_k of the last stable_n processed frames
  # This filters out one-frame false alarms before "found" is spoken.
  stable_k: 3
  stable_n: 5
  iou_track_min: 0.3     # prefer the box that overlaps the one we were tracking

  # Find mode timings (FR-12, FR-19, FR-64)
  not_found_prompt_s: 4.0    # say "Not seeing <item>. Turn slowly." after this long
  not_found_repeat_s: 8.0    # ... and repeat it no more often than this
  lost_timeout_s: 1.5        # say "Lost it." after this long without the target
  direction_repeat_s: 1.5    # repeat an unchanged direction this often

  # Direction math (PRD 8.3), all in normalized 0..1 frame units
  straight_tol: 0.08         # box center within this of the middle = "straight ahead"
  slight_tol: 0.25           # ... within this = "slightly left / right"; beyond = "left / right"
  high_shelf_max: 0.33       # box center above this = "high shelf"
  low_shelf_min: 0.66        # box center below this = "low shelf"; in between = "eye level"
  vertical_offset: 0.0   # added to box center y; calibrate for camera tilt (see README)
  direction_hysteresis: 0.02 # extra distance past a boundary before the spoken zone changes
  flip_horizontal: false     # set true if "left" and "right" come out swapped

  # Within reach (FR-16)
  reach_h: 0.35              # box height (fraction of frame) that counts as "within reach"
  reach_hold_s: 1.0          # ... held for this long
  reach_exit_ratio: 0.8  # leave WITHIN_REACH only when box height drops below reach_h * this

  # Identify mode (FR-31, FR-32)
  identify_burst: 5          # ask the device for this many frames
  identify_min_votes: 3      # the same class must win in at least this many of them
  identify_timeout_s: 1.5    # give an answer (or "Not sure") after this long regardless
  identify_center_weight: 0.5   # how much being near the frame center counts vs confidence
  identify_max_objects: 3    # report up to this many distinct visible objects

  # Wrong item nearby (FR-20)
  wrong_item_enabled: true
  wrong_item_center_tol: 0.15   # the other item must be this close to center to be mentioned
  wrong_item_repeat_s: 5.0      # repeat the warning no more often than this
  non_item_classes: [hand]      # detector classes that are never spoken as an item (FR-20, FR-31)

  # Hand guidance (the fast backend supplies hand boxes from EgoHands). The visible
  # hand is steered onto the item ("Hand left.", "Reach forward.") and "That's it." checks the
  # item off when the hand covers it.
  hand_guidance_enabled: true
  hand_guidance_always: true # start hand cues as soon as a hand and the target are visible
  hand_conf: 0.5             # engine-side floor; the detector already filters at fast_hand_conf 0.55
  hand_cue_tol: 0.08         # hand within this of the item center (frame fraction) = aligned
  hand_touch_overlap: 0.3    # share of the hand box that must overlap the item to count as touching
  hand_touch_hold_s: 0.5     # ... held this long before "That's it."
  hand_repeat_s: 1.5         # repeat an unchanged hand cue this often
  hand_auto_check_off: true  # "That's it." also checks the item off (false: press the shutter)

  # Object permanence while the hand covers the item (needs hand_guidance_enabled, because
  # the hand box is the anchor). A detector cannot see through the hand, so the item box
  # disappears exactly when the grab succeeds. The engine keeps a predicted "ghost" box
  # anchored to the hand (which moves with the wearer), so a grab is not mistaken for a
  # lost item.
  hand_ghost_enabled: true
  hand_ghost_max_s: 1.2      # how long a hand-covered item may stay invisible
  hand_ghost_max_offset: 0.15  # secondary bound: hand center this close to the item center
  hand_ghost_min_ratio: 0.25 # sanity bounds on item height / hand height
  hand_ghost_max_ratio: 4.0

  # Camera-motion gate. The camera is worn on the body, so the picture moves whenever the
  # shopper turns or walks. While it moves, a missing item is not evidence of a loss:
  # freeze the "Lost it." timer until the view settles. (A grab is not affected: the
  # predicted box is anchored to the hand, not to the background.)
  camera_motion_freeze: 0.008   # frame-to-frame shift (fraction of the frame) that means "moving"
  camera_motion_settle_s: 0.3   # keep the freeze this long after the picture stops moving
  camera_motion_max_freeze_s: 2.0  # never extend the lost timer by more than this

  # Panned guidance tone (FR-21)
  # A beep in the headphones that comes from the target's side and speeds up as you get close.
  tones_enabled: true
  tone_freq_hz: 880          # pitch of the beep (A5)
  tone_duration_ms: 60       # length of each beep
  tone_interval_max_ms: 900  # time between beeps when the target is far / off to the side
  tone_interval_min_ms: 120  # time between beeps when centered and close
  tone_min_change_ms: 60     # only update the device when the interval changes by this much
  tone_min_change_pan: 0.1   # ... or the stereo position changes by this much (-1..1 scale)

  # "Getting closer" (FR-22, P2)
  getting_closer_enabled: false
  getting_closer_ratio: 1.3      # say it when the box has grown by 30%
  getting_closer_repeat_s: 3.0

  # Maximum frames per second the device is asked to stream.
  # 20 fps is a sustainable target for the Pi Zero 2 W at 640x480.
  stream_max_fps: 20
  # Keep the camera live while the mode switch is ON, even if a search is stopped.
  stream_in_idle: true
  # Keep the camera and detector running while the switch is OFF, but stay silent.
  stream_in_off: true
  # ON means "guide me now": start Find for the current list item automatically.
  auto_find_on_mode_on: true

# Text-to-speech: how sentences from config/phrases.yaml become audio clips.
tts:
  engines: [piper, espeak, pyttsx3]   # tried in order, first one that works wins
  piper_voice: models/voices/en_US-lessac-medium.onnx   # downloaded by `slr clips download-voice`
  piper_voice_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
  length_scale: 1.0      # FR-66 speech rate: < 1 is faster, > 1 slower
  sample_rate: 22050     # audio samples per second of the generated clips

# Where the server keeps its files (relative to the repo folder).
paths:
  shopping_list: data/shopping_list.yaml   # the live shopping list
  user_catalog: data/catalog_user.yaml     # items the user added (with their prompts)
  clips_dir: data/clips                    # rendered speech clips (cache)
  logs_dir: data/logs                      # one JSONL session log per run (FR-72)
  captured_dir: data/captured              # frames saved with the "f" key for training

# The on-screen window that shows the camera view with detection boxes (for developers).
debug_view:
  enabled: true
  window_name: SLR SLR debug
