# Laptop server configuration (PRD section 4, 8). Paths are relative to the repo root.

network:
  host: 0.0.0.0
  ws_port: 8765          # control channel: WebSocket over TCP (PRD 7.2)
  udp_port: 8766         # frame channel: UDP (PRD 7.1)
  http_port: 8767        # clip downloads + accessible shopping list editor (FR-4, FR-53)
  mdns: true             # advertise _slrslr._tcp so the device can find us (FR-51 P1)

model:
  # M1 uses a stock COCO model so the pipeline works before training finishes.
  # After Stage A training: weights: models/grocereye_a/best.pt, classes_file: config/classes.yaml
  backend: ultralytics   # ultralytics | darknet_opencv | scripted
  weights: yolo11n.pt
  classes_file: config/classes_coco.yaml
  device: auto           # auto picks CUDA, then Apple MPS, then CPU
  imgsz: 640
  min_conf: 0.25         # detector floor; the guidance thresholds below decide what gets spoken
  half: false
  darknet_cfg: null      # darknet_opencv backend only
  darknet_weights: null
  scripted_file: null    # scripted backend only (tests / replay without a model)

guidance:
  # Confidence thresholds. conf_find is rewritten by training/pick_threshold.py (TR-14).
  conf_find: 0.5
  conf_identify: 0.6
  conf_wrong_item: 0.7

  # Stable detection (PRD 8.2): target in >= stable_k of the last stable_n processed frames
  stable_k: 3
  stable_n: 5
  iou_track_min: 0.3     # prefer the box that overlaps the one we were tracking

  # Find mode timings (FR-12, FR-19, FR-64)
  not_found_prompt_s: 4.0
  not_found_repeat_s: 8.0
  lost_timeout_s: 1.5
  direction_repeat_s: 1.5

  # Direction math (PRD 8.3), all in normalized 0..1 frame units
  straight_tol: 0.08
  slight_tol: 0.25
  high_shelf_max: 0.33
  low_shelf_min: 0.66
  vertical_offset: 0.0   # added to box center y; calibrate for camera tilt (see README)
  direction_hysteresis: 0.02
  flip_horizontal: false

  # Within reach (FR-16)
  reach_h: 0.35
  reach_hold_s: 1.0
  reach_exit_ratio: 0.8  # leave WITHIN_REACH only when box height drops below reach_h * this

  # Identify mode (FR-31, FR-32)
  identify_burst: 5
  identify_min_votes: 3
  identify_timeout_s: 1.5
  identify_center_weight: 0.5

  # Wrong item nearby (FR-20)
  wrong_item_enabled: true
  wrong_item_center_tol: 0.15
  wrong_item_repeat_s: 5.0

  # Panned guidance tone (FR-21)
  tones_enabled: true
  tone_freq_hz: 880
  tone_duration_ms: 60
  tone_interval_max_ms: 900
  tone_interval_min_ms: 120
  tone_min_change_ms: 60
  tone_min_change_pan: 0.1

  # "Getting closer" (FR-22, P2)
  getting_closer_enabled: false
  getting_closer_ratio: 1.3
  getting_closer_repeat_s: 3.0

  stream_max_fps: 10

tts:
  engines: [piper, espeak, pyttsx3]   # tried in order, first one that works wins
  piper_voice: models/voices/en_US-lessac-medium.onnx
  piper_voice_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx
  length_scale: 1.0      # FR-66 speech rate: < 1 is faster, > 1 slower
  sample_rate: 22050

paths:
  shopping_list: data/shopping_list.yaml
  clips_dir: data/clips
  logs_dir: data/logs
  captured_dir: data/captured

debug_view:
  enabled: true
  window_name: SLR SLR debug
