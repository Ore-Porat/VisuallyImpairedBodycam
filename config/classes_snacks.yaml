# Snack demo classes (historical; the shipped server uses the fast_grocery backend).
# class_id -> spoken name (FR-62).
#
# What this file is for
#   The snack model was trained (training run runs/detect/train, YOLO11n, imgsz 640) on photos
#   of the six products we demoed with. The ids below are in the model's own class order
#   (0..5). The shipped server no longer loads this model; the file is kept as a historical
#   reference.
#
# Format
classes:
  oreo: Oreos
  cheerios: Cheerios
  coca_cola_can: Coca-Cola can
  campbells_chicken_noodle: Campbell's chicken noodle soup
  lays: Lay's chips
  # cheetos: Cheetos   # muted in the old snack demo; not used by the fast backend
  hand: hand
