# Phrase catalog (FR-61). Every spoken phrase is a template rendered to a WAV clip on the laptop.
# Placeholders: {item} {next} {other} are class ids and are spoken using config/classes*.yaml.
# {h} and {v} come from the `directions` table below. Clips regenerate automatically when
# the rendered text changes (the clip file name includes a hash of the text).
#
# priority (FR-63): system > confirmation > guidance > info. A higher priority cue
# interrupts a lower one. Guidance cues never queue: the newest one replaces any waiting one.
#
# What this file is for
#   Everything the device ever says is written here, in plain English, so the wording can
#   be changed without touching code. The laptop turns each sentence into speech once
#   (with the Piper text-to-speech voice) and the device plays the resulting audio clip.
#   FR-61 and FR-63 are requirement numbers from the product spec, PRD.pdf.
#
# Who reads it
#   The laptop server (slr/server/clips.py). The guidance engine (slr/server/guidance.py)
#   refers to phrases by the key on the left ("found", "within_reach" ...), so the KEYS
#   must not be renamed; the TEXT on the right can be edited freely.
#
# How to edit safely
#   Keep the braces around placeholders exactly as they are. Keep the quotes around text.
#   Each phrase needs a priority: info (least important) < guidance < confirmation < system.

# Words substituted for {h} (horizontal) and {v} (vertical) in the direction phrases.
directions:
  left: Left
  slightly_left: Slightly left
  straight: Straight ahead
  slightly_right: Slightly right
  right: Right
  high: High shelf
  eye: Eye level
  low: Low shelf
  # Words substituted for {hd}: which way the HAND must move to land on the item.
  hand_left: Hand left
  hand_right: Hand right
  hand_up: Hand up
  hand_down: Hand down
  hand_up_left: Hand up and left
  hand_up_right: Hand up and right
  hand_down_left: Hand down and left
  hand_down_right: Hand down and right
  hand_forward: Reach forward

# Phrases spoken by the laptop server during normal use. key: {priority, text}.
phrases:
  # Mode switch
  ready:               {priority: confirmation, text: "Ready."}
  paused:              {priority: confirmation, text: "Paused."}
  standby_hint:        {priority: info, text: "Paused. Turn the switch on to continue."}
  # Moving through the shopping list ({n} = item number, {total} = list length)
  list_empty:          {priority: confirmation, text: "Your shopping list is empty."}
  item_announce:       {priority: confirmation, text: "Item {n} of {total}: {item}."}
  item_announce_found: {priority: confirmation, text: "Item {n} of {total}: {item}. Already found."}
  item_marked_found:   {priority: confirmation, text: "{item} marked found."}
  item_marked_found_next: {priority: confirmation, text: "{item} marked found. Next: {next}."}
  item_marked_found_done: {priority: confirmation, text: "{item} marked found. That was the last item on your list."}
  item_marked_pending: {priority: confirmation, text: "{item} marked not found."}
  # Find mode: searching, guiding, reaching, checking off
  searching:           {priority: confirmation, text: "Searching for {item}."}
  search_stopped:      {priority: confirmation, text: "Search stopped."}
  not_seeing:          {priority: guidance, text: "Not seeing {item}. Turn slowly."}
  found:               {priority: confirmation, text: "{item} found."}
  direction:           {priority: guidance, text: "{h}. {v}."}
  direction_h:         {priority: guidance, text: "{h}."}
  within_reach:        {priority: confirmation, text: "Within reach. {item} straight ahead."}
  hand_dir:            {priority: guidance, text: "{hd}."}
  hand_on_item:        {priority: confirmation, text: "That's it."}
  checked_off_next:    {priority: confirmation, text: "{item} checked off. Next: {next}."}
  checked_off_done:    {priority: confirmation, text: "{item} checked off. That was the last item on your list."}
  lost:                {priority: confirmation, text: "Lost it."}
  wrong_item:          {priority: confirmation, text: "That's {other}, not {item}."}
  getting_closer:      {priority: guidance, text: "Getting closer."}
  # Identify mode ("what am I holding?")
  identifying:         {priority: info, text: "Checking."}
  identified:          {priority: confirmation, text: "This is {item}."}
  identified_on_list:  {priority: confirmation, text: "This is {item}. It's on your list."}
  identified_many:     {priority: confirmation, text: "I see {items}."}
  not_sure:            {priority: confirmation, text: "Not sure. Hold it closer to the camera."}
  not_sure_loss:       {priority: confirmation, text: "Not sure."}
  # Progress report (rewind knob held) and help (advance lever held)
  status:              {priority: confirmation, text: "{found} of {total} items found. Current item: {item}."}
  status_done:         {priority: confirmation, text: "All {total} items found."}
  help:
    priority: confirmation
    # ">-" means: the indented lines below are one long piece of text (line breaks become spaces).
    text: >-
      Mode switch on starts guiding to the current item.
      Flick the mode switch to the toggle position to mark the current item found and move to the next item.
      Flick it on an already found item to mark it not found.
      Hold it there to identify what is in front of the camera.
      Shutter: press to stop or restart the search.
      When an item is within reach, press the shutter to check it off.
      Film advance lever: next item. Hold it for this help.
      Rewind knob: previous item. Hold it to hear your progress.
      Turn the dial to change the volume.
      Mode switch off silences guidance but keeps the camera running.
      Hold the shutter and the advance lever together for five seconds to shut down.

# Clips that ship with the device and play without the server (FR-52, FR-55, FR-56, FR-45).
# Render with `slr clips build-system`; output goes to device_assets/system_clips/<key>.wav
# These have no placeholders and no priority setting: the device program decides the
# priority itself, because they report on the device (boot, connection, volume).
system_phrases:
  starting_up: "Starting up."
  connected: "Connected."
  connection_lost: "Connection lost. Reconnecting."
  not_connected: "Not connected to the laptop yet."
  camera_error: "Camera error."
  video_weak: "Video connection weak."
  shutting_down: "Shutting down."
  # One clip per volume level 0..10, spoken when the dial stops moving.
  volume_0: "Volume 0."
  volume_1: "Volume 1."
  volume_2: "Volume 2."
  volume_3: "Volume 3."
  volume_4: "Volume 4."
  volume_5: "Volume 5."
  volume_6: "Volume 6."
  volume_7: "Volume 7."
  volume_8: "Volume 8."
  volume_9: "Volume 9."
  volume_10: "Volume 10."
