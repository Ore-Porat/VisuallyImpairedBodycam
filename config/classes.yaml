# GrocerEye / Freiburg Groceries classes: class_id -> spoken name (FR-62).
# Regenerated by training/get_grocereye_data.py from the dataset annotations; hand-edit the
# spoken names freely (the script keeps existing spoken names when it regenerates).
#
# What this file is for
#   The fast zero-shot detector has one CLIP prompt per grocery class in
#   slr/server/grocery_taxonomy.py. This file lists the same ids and is the authoritative
#   list of item names for the shopping list. Each line is:   internal_id: what the voice says
#   The left side (the id) must match the CLIP label and is used in commands such as
#   `slr list add tomato_sauce`. The right side is only for speech, so you can change it to
#   anything that sounds natural ("tomato sauce", "pasta sauce", ...).
#
# Who reads it
#   This file is a historical/legacy fixture. The shipped server reads config/catalog.yaml
#   (via the `catalog_file` setting), which has the same ids plus the CLIP prompts. This file
#   is kept because the loader still understands the old `classes:` shape and tests use it.
#   FR-62 is a requirement number from the product spec, PRD.pdf.
#
# How to edit safely
#   Keep the two-space indentation and the "id: name" shape. Do not rename ids unless the
#   model is retrained with the new names. Lines starting with # are comments and ignored.
classes:
  beans: beans
  cake: cake
  candy: candy
  cereal: cereal
  chips: chips
  chocolate: chocolate
  coffee: coffee
  corn: corn
  fish: fish
  flour: flour
  honey: honey
  jam: jam
  juice: juice
  milk: milk
  nuts: nuts
  oil: oil
  pasta: pasta
  rice: rice
  soda: soda
  spices: spices
  sugar: sugar
  tea: tea
  # Ids use underscores instead of spaces; the spoken name can use spaces.
  tomato_sauce: tomato sauce
  vinegar: vinegar
  water: water
  cookies: cookies   # sweet biscuits (Oreos); added 2026-10-28 from Products-6K
  # Not a grocery item: the shopper's own hand, so guidance can steer it to the item later.
  # The guidance engine never names it as a found / wrong / identified item.
  hand: hand
  # Demo-shelf brands (2026-11-12), in the same order as config/catalog.yaml.
  lays: Lay's chips
  oreo: Oreos
  coca_cola_can: Coca-Cola
  chicken_noodle_soup: chicken noodle soup
  cheerios: Cheerios
