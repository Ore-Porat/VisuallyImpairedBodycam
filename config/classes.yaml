# GrocerEye / Freiburg Groceries classes: class_id -> spoken name (FR-62).
# Regenerated by training/get_grocereye_data.py from the dataset annotations; hand-edit the
# spoken names freely (the script keeps existing spoken names when it regenerates).
#
# What this file is for
#   The object-detection model can only recognize the categories it was trained on. This
#   file lists those categories. Each line is:   internal_id: what the voice should say
#   The left side (the id) must match the model and is used in commands such as
#   `slr list add tomato_sauce`. The right side is only for speech, so you can change it to
#   anything that sounds natural ("tomato sauce", "pasta sauce", ...).
#
# Who reads it
#   The laptop server (slr/server) loads it at startup; config/server.yaml points at it with
#   the `classes_file` setting. `slr list classes` prints the ids. FR-62 is a requirement
#   number from the product spec, PRD.pdf.
#
# How to edit safely
#   Keep the two-space indentation and the "id: name" shape. Do not rename ids unless the
#   model is retrained with the new names. Lines starting with # are comments and ignored.
classes:
  beans: beans
  cake: cake
  candy: candy
  cereal: cereal
  chips: chips
  chocolate: chocolate
  coffee: coffee
  corn: corn
  fish: fish
  flour: flour
  honey: honey
  jam: jam
  juice: juice
  milk: milk
  nuts: nuts
  oil: oil
  pasta: pasta
  rice: rice
  soda: soda
  spices: spices
  sugar: sugar
  tea: tea
  # Ids use underscores instead of spaces; the spoken name can use spaces.
  tomato_sauce: tomato sauce
  vinegar: vinegar
  water: water
  # Not a grocery item: the shopper's own hand, so guidance can steer it to the item later.
  # The guidance engine never names it as a found / wrong / identified item.
  hand: hand
