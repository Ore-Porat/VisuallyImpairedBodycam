      - "a glass jar of honey"
      - "a plastic honey bottle"
  jam:
    spoken: jam
    prompts:
      - "a jar of jam"
      - "a glass jar of fruit preserves"
      - "a jam jar with a lid"
  juice:
    spoken: juice
    prompts:
      - "a bottle of juice"
      - "a carton of fruit juice"
      - "a plastic juice bottle"
  milk:
    spoken: milk
    prompts:
      - "a carton of milk"
      - "a milk carton"
      - "a plastic jug of milk"
  nuts:
    spoken: nuts
    prompts:
      - "a bag of nuts"
      - "a package of peanuts"
      - "a jar of mixed nuts"
  oil:
    spoken: oil
    prompts:
      - "a bottle of cooking oil"
      - "a clear bottle of vegetable oil"
      - "a large oil bottle"
  pasta:
    spoken: pasta
    prompts:
      - "a package of pasta"
      - "a bag of dry pasta"
      - "a box of spaghetti"
  rice:
    spoken: rice
    prompts:
      - "a bag of rice"
      - "a large sack of white rice"
      - "a rice package"
  soda:
    spoken: soda
    prompts:
      - "a can of soda"
      - "a soda bottle"
      - "a carbonated drink can"
  spices:
    spoken: spices
    prompts:
      - "a spice jar"
      - "a small jar of spices"
      - "a spice container"
  sugar:
    spoken: sugar
    prompts:
      - "a bag of sugar"
      - "a paper bag of white sugar"
      - "a sugar package"
  tea:
    spoken: tea
    prompts:
      - "a box of tea"
      - "a tea box with tea bags"
      - "a packet of tea"
  tomato_sauce:
    spoken: tomato sauce
    prompts:
      - "a can of tomato sauce"
      - "a jar of tomato sauce"
      - "a can of crushed tomatoes"
  vinegar:
    spoken: vinegar
    prompts:
      - "a bottle of vinegar"
      - "a clear bottle of white vinegar"
      - "a vinegar bottle"
  water:
    spoken: water
    prompts:
      - "a bottle of water"
      - "a clear plastic water bottle"
      - "a water bottle"
  cookies:
    spoken: cookies
    prompts:
      - "a package of cookies"
      - "a box of cookies"
      - "a bag of biscuits"
  # Not a grocery item: the shopper's own hand, supplied by the EgoHands detector. It is kept
  # here so every class the detector can report has a spoken name, but the shopping list never
  # offers it (`guidance.non_item_classes: [hand]`).
  hand:
    spoken: hand
    non_item: true
  # Demo-shelf brands (2026-11-12). Added after hand so the GrocerEye indices above do not move.
  # Prompts checked on the team's snack photos with training/calibrate_items.py (see
  # DECISIONS.md): every brand reaches 0.90 precision on its own, and any two of them are told
  # apart 99% of the time. The generic items above stay for other brands.
  lays:
    spoken: Lay's chips
    prompts:
      - "a bag of Lay's potato chips"
      - "a yellow bag of Lay's chips"
      - "a Lay's chip bag"
    aliases: ["lays", "lay's", "lays chips"]
  oreo:
    spoken: Oreos
    prompts:
      - "a package of Oreo cookies"
      - "a blue package of Oreo cookies"
      - "an Oreo cookie pack"
    aliases: ["oreos", "oreo cookies"]
  coca_cola_can:
    spoken: Coca-Cola
    prompts:
      - "a can of Coca-Cola"
      - "a red Coca-Cola can"
      - "a Coke can"
    aliases: ["coke", "coca cola can", "coke can"]
  chicken_noodle_soup:
    spoken: chicken noodle soup
    prompts:
      - "a can of Campbell's chicken noodle soup"
      - "a red and white Campbell's soup can"
      - "a can of chicken noodle soup"
    aliases: ["campbell's chicken noodle soup", "campbells chicken noodle soup"]
  cheerios:
    spoken: Cheerios
    prompts:
      - "a box of Cheerios cereal"
      - "a yellow box of Cheerios"
      - "a Cheerios cereal box"
    aliases: ["cheerio"]
