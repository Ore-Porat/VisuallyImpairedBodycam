# pyproject.toml: the standard Python project file. It tells pip how to install this
# project, which packages it depends on, and configures the test runner. Sections in
# square brackets are called "tables"; lines are key = value.
#
# Typical use:  pip install -e ".[server,dev]"   (laptop)     pip install -e ".[device]"   (Pi)
# "-e" means editable: edits to the code take effect without reinstalling. The names in
# square brackets pick optional extras from [project.optional-dependencies] below.

# How to build/install the project: use setuptools, the standard build tool.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Basic facts about the project.
[project]
name = "slr-slr"
version = "0.1.0"
description = "SLR SLR (Single Lens Reflex Sightless Label Reader): wearable grocery finder for visually impaired shoppers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Team #4 Colorado Dreaming (GEEN 1400, Fall 2026)" }]
# Packages that are ALWAYS installed (needed by both the laptop and the Pi):
#   pydantic   checks the config files and gives clear errors for typos
#   pyyaml     reads the .yaml config files
#   websockets the control channel between device and laptop
#   numpy      fast arrays, used for images and audio samples
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
    "websockets>=13",
    "numpy>=1.24",
]

# Optional groups of packages. Install with pip install -e ".[name]".
[project.optional-dependencies]
# Laptop: detector, TTS, debug view, mDNS
#   opencv-python  camera / image handling and the debug window
#   ultralytics    the YOLO object detector
#   piper-tts      text-to-speech that renders the spoken phrases
#   zeroconf       mDNS, so the device can find the laptop by name
#   sounddevice    audio playback (used by the simulated device)
server = [
    "opencv-python>=4.8",
    "ultralytics>=8.3",
    "piper-tts>=1.2",
    "zeroconf>=0.130",
    "sounddevice>=0.4.6",   # sim device plays through laptop speakers
]
# Raspberry Pi Zero 2 W. No ML runtimes here (PRD rule 4). OpenCV comes from apt.
#   gpiozero / lgpio  reading buttons and the mode switch
#   spidev            talking to the MCP3002 volume-dial chip over SPI
#   simplejpeg        fast JPEG compression of camera frames
#   adafruit-blinka   board I2C pins; adafruit-circuitpython-tlv320 configures the DAC
#   The "; platform_..." parts mean "only on that kind of machine" (64-bit ARM / Linux).
device = [
    "sounddevice>=0.4.6",
    "gpiozero>=2.0",
    "lgpio>=0.2; platform_machine=='aarch64'",
    "spidev>=3.6; platform_system=='Linux'",
    "simplejpeg>=1.7",
    "zeroconf>=0.130",
    "adafruit-blinka>=8.0",
    "adafruit-circuitpython-tlv320>=1.0",
]
# Training the detector (see training/README.md).
training = [
    "ultralytics>=8.3",
    "opencv-python>=4.8",
    "albumentations>=1.4",   # blur + JPEG augmentation during training
    "openpyxl>=3.1",         # reads the Products-6K .xlsx labels (get_products6k_data.py)
]
# Developer tools: pytest runs the tests in tests/; pytest-asyncio lets tests use async code.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

# Command-line programs created on install: typing `slr` runs the main() function in
# slr/cli.py. That is where `slr sim`, `slr server`, `slr device` ... come from.
[project.scripts]
slr = "slr.cli:main"

# Which folders are Python packages to install: everything under slr/ (not tests/ or training/).
[tool.setuptools.packages.find]
include = ["slr*"]

# Settings for pytest (the test runner).
#   testpaths     look for tests in the tests/ folder
#   asyncio_mode  "auto" runs `async def` tests without needing a marker on each one
#   ..._loop_scope  each test gets its own fresh event loop
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
